name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint & boot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools xz-utils

      # Make /dev/kvm usable for the optional KVM boot test (harmless if
      # the runner doesn't provide KVM — that step then skips itself).
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod a+rw /dev/kvm || true
          fi

      # rust-toolchain.toml pins stable + x86_64-unknown-none + clippy/rustfmt;
      # the first cargo command installs it automatically.

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (kernel, no warnings)
        run: cargo clippy --release

      - name: Build kernel
        run: make build

      - name: Fetch Limine & build bootable image
        run: make image

      - name: Boot test — UEFI (OVMF, TCG)
        run: make smoke-atom

      - name: Boot test — legacy BIOS (SeaBIOS)
        run: make smoke-bios

      # Same UEFI image under KVM. OVMF occasionally stalls on loaded
      # hosts before the kernel runs (firmware-side quirk, unrelated to
      # mog-os) — functional UEFI coverage is provided by the TCG test
      # above, so this step is informational only.
      - name: Boot test — UEFI under KVM (informational)
        continue-on-error: true
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            make smoke
          else
            echo "no /dev/kvm — skipping"
          fi

      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: build/serial.log
          if-no-files-found: ignore
