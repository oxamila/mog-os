# Limine configuration — https://github.com/limine-bootloader/limine

# Seconds before the default entry boots automatically (any key = menu).
timeout: 3

# Mirror bootloader output to the serial port (captured by QEMU).
serial: yes

/MOG-OS
    protocol: limine
    # boot(): refers to the partition limine.conf was loaded from.
    kernel_path: boot():/boot/mog-kernel
